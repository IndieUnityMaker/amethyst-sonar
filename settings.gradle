pluginManagement {
    repositories {
        // Optional local mirror seeded by curl on machines where Gradle's own
        // transport is unreliable (see the Sonar launcher docs). Ignored if absent.
        def seeded = new File(rootDir, ".local-maven")
        if (seeded.isDirectory()) maven { url = seeded.toURI() }
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        def seeded = new File(rootDir, ".local-maven")
        if (seeded.isDirectory()) maven { url = seeded.toURI() }
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
        // Prebuilt native libraries shipped in the repository (GL translators, LWJGL natives...).
        flatDir { dirs new File(rootDir, "app_pojavlauncher/libs") }
    }
}

rootProject.name='Amethyst'
include ':jre_lwjgl3glfw'
include ":jre_lwjgl3glfw:lwjgl-3.3.3"
include ":jre_lwjgl3glfw:lwjgl-3.4.1"
include ':app_pojavlauncher'

include ':arc_dns_injector'
include ':MioLibPatcher'
include ':forge_installer'
include ':androidnsbypass'
